aid: derbysoft
name: DerbySoft
description: >-
  DerbySoft is a global travel-technology company — "The Travel Commerce
  Accelerator" — that provides high-performance distribution connectivity,
  content management, and digital-marketing services to the travel industry.
  Founded in 2002 and operating worldwide, DerbySoft connects hotel suppliers,
  channel managers, OTAs, metasearch engines, and TMCs through standardized
  APIs: a JSON/REST Property Connector Integration API for pushing rates,
  availability, inventory and reservations across 500+ channels, and OTA
  2016B-based Content Distributor and Content Supplier APIs for querying and
  writing hotel content (properties, guestrooms, rate plans, images). The
  platform also covers streamlined connectivity, business-travel and flight
  distribution, and AI-driven marketing. This profile was enriched from
  DerbySoft's public developer knowledge bases.
