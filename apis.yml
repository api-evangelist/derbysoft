apis:
- name: DerbySoft Property Connector Integration API
  description: >-
    JSON/REST API for hotels and PMS/channel-manager systems to push
    availability, rates and inventory (ARI), manage property, room, rate-plan
    and channel configuration, and exchange reservations across 500+ channels.
    Uses client-credentials Basic auth to obtain a Bearer token; TLS 1.2+ only;
    rate limited to 15 requests/second.
  humanURL: https://pc.knowledgebase.derbysoftsec.com/support/home
  baseURL: https://pcendpoint.derbysoftsec.com/pcapigateway
  properties:
  - type: Documentation
    url: https://pc.knowledgebase.derbysoftsec.com/support/home
  - type: APIReference
    url: https://pc.knowledgebase.derbysoftsec.com/en/support/solutions/articles/70000157127-api-overview
  - type: Authentication
    url: https://pc.knowledgebase.derbysoftsec.com/en/support/solutions/articles/70000663114-account
- name: DerbySoft Content Distributor API
  description: >-
    OTA 2016B XML API for distributors (OTAs, metasearch, corporate travel,
    travel agencies) to access hotel content in DerbySoft Content Solutions via
    OTA_HotelSearchRQ/RS and OTA_HotelDescriptiveInfoRQ/RS message pairs.
  humanURL: https://contentsolutions.knowledgebase.derbysoftsec.com/en/support/solutions/articles/70000673856-content-distributor-api
  properties:
  - type: Documentation
    url: https://contentsolutions.knowledgebase.derbysoftsec.com/support/home
- name: DerbySoft Content Supplier API
  description: >-
    API for property-industry suppliers to query and write hotel content —
    property information, guestrooms, and rate plans — into DerbySoft Content
    Solutions using GET and POST operations.
  humanURL: https://contentsolutions.knowledgebase.derbysoftsec.com/en/support/solutions/articles/70000671527-about-content-supplier-api
  properties:
  - type: Documentation
    url: https://contentsolutions.knowledgebase.derbysoftsec.com/support/home
